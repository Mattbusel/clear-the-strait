## Clear the Strait — XcodeGen project spec.
##
## The .xcodeproj is generated rather than committed: it is authored on Windows
## where it cannot be opened, and a hand-edited pbxproj is the single most
## conflict-prone file in an iOS repo.
##
## Every setting here that looks oddly specific is one that cost a CI cycle to
## learn on the previous app in this account. They are commented accordingly.

name: ClearTheStrait

options:
  bundleIdPrefix: com.mattbusel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ClearTheStrait:
    type: application
    platform: iOS

    dependencies:
      - target: StraitWidgets

    sources:
      - path: Sources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources

    # 1.2: the app group the widgets read the streak from, and Game Center now
    # that the app is published (the trap below only applies to an app that
    # has never been released).
    entitlements:
      path: Resources/ClearTheStrait.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mattbusel.clearthestrait
        com.apple.developer.game-center: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbusel.clearthestrait
        # No spaces. The user-visible name comes from CFBundleDisplayName;
        # PRODUCT_NAME is a path component, and a space in it breaks the default
        # TEST_HOST expansion with "Could not find test host".
        PRODUCT_NAME: ClearTheStrait
        INFOPLIST_KEY_CFBundleDisplayName: Clear the Strait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Icon Pack (1.2): alternate icons, switched with setAlternateIconName.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Night AppIcon-Marina AppIcon-Fog"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # Portrait only. The channel runs across the short edge and the whole
        # layout assumes it; a landscape build would need a second design.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # iPhone only. An iPad build doubles the screenshot matrix and the
        # layout surface for a game nobody is going to play on a tablet.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        PROVISIONING_PROFILE_SPECIFIER: "${APP_PROFILE}"

    # Game Center history: an app with Game Center config that had never been
    # published could not have its version added to a review submission, so 1.0
    # shipped without it. The app is published now; 1.2 adds the leaderboards.

    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Clear the Strait
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # No custom cryptography. Declared in the build so an upload never parks
        # in "Missing Compliance" waiting on a form.
        ITSAppUsesNonExemptEncryption: false
        # clearthestrait://daily, ://season, ://club: widgets, notifications and In-App Events.
        CFBundleURLTypes:
          - CFBundleURLName: com.mattbusel.clearthestrait
            CFBundleURLSchemes:
              - clearthestrait
        # Deliberately absent: no camera, no photo library, no location, no
        # microphone, no contacts. The game asks the player for nothing at all,
        # which makes both the first run and the privacy review short.

  StraitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Sources/Shared
      - path: Sources/Game/Rules.swift
      - path: Sources/Game/Daily.swift
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: Widgets/StraitWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mattbusel.clearthestrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbusel.clearthestrait.widgets
        PRODUCT_NAME: StraitWidgets
        PROVISIONING_PROFILE_SPECIFIER: "${EXT_PROFILE}"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Clear the Strait
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ClearTheStraitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: ClearTheStrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbusel.clearthestrait.tests
        # Names the host app. A dependency alone does not wire TEST_HOST, and
        # without it the build fails with "Could not find test host", which
        # sounds like a missing target rather than a missing setting.
        # Spelled out rather than left to inference: a dependency alone does
        # not wire TEST_HOST, and neither does TEST_TARGET_NAME on a unit test
        # bundle.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClearTheStrait.app/ClearTheStrait"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # A test bundle is signed too, and signing needs a plist. Without this
        # every test run dies with "Cannot code sign because the target does not
        # have an Info.plist file" while the app itself compiles perfectly.
        GENERATE_INFOPLIST_FILE: YES
        # Never signed with a real identity: it only ever runs on a simulator.
        # Left on automatic signing, a test bundle asks for a *development*
        # profile during archive, which needs registered devices, and an account
        # with none fails an App Store build with a message about devices.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""

  ClearTheStraitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ScreenshotTests
    dependencies:
      - target: ClearTheStrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbusel.clearthestrait.uitests
        TEST_TARGET_NAME: ClearTheStrait
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""

schemes:
  ClearTheStrait:
    build:
      targets:
        # The app is built for every action; the test bundles only for testing.
        ClearTheStrait: all
        ClearTheStraitTests: [test]
        ClearTheStraitUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ClearTheStraitTests
        - ClearTheStraitUITests
    archive:
      config: Release
